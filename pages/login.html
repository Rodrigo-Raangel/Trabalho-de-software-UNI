<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css"
</head>
<body>
    <div class="carrossel">
        <div class="logo">UNICA</div>
    </div>
    <div class="form">
        <h1>Portal do Aluno</h1>
        <p class="login">Caso não possua uma conta, <a href='#'>crie uma conta</a></p>
        <form>
            <input type="email" placeholder="Digite seu e-mail aqui">
            <div class="senha">
            <input type="password" id='senhaInput'placeholder="Digite sua senha aqui">
            <span class=='toggle' onclick="togglePassword()">👁</span>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>
    <script>
        function togglePassword() {
        const senhaInput = document.querySelector('#senhaInput');
        senhaInput.type = senhaInput.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
